/* ===== UZBEK DICTIONARY DESIGN ===== */

:root {
  --bg: #f5f7fc;
  --surface: #ffffff;
  --text: #182238;
  --muted: #778198;
  --primary: #5b5ce2;
  --primary-hover: #4849c9;
  --border: #e6e9f2;
  --shadow: 0 8px 28px rgba(30, 41, 80, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: "Segoe UI", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.65;
}

header {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: white;
  padding: 36px 20px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 800;
  letter-spacing: -1px;
}

header p {
  margin: 10px 0 0;
  color: #eeedff;
  font-size: 16px;
}

nav {
  display: flex;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  padding: 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

nav a {
  color: var(--text);
  text-decoration: none;
  padding: 9px 15px;
  border-radius: 10px;
  font-weight: 600;
}

nav a:hover {
  background: #efefff;
  color: var(--primary);
}

main {
  width: min(900px, 92%);
  margin: 35px auto;
}

section {
  margin-bottom: 26px;
}

h2 {
  font-size: 25px;
  line-height: 1.3;
  margin: 0 0 16px;
}

h3 {
  line-height: 1.35;
}

input,
textarea,
select {
  display: block;
  width: 100%;
  padding: 14px 16px;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--surface);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus,
textarea:focus,
select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(91, 92, 226, 0.12);
}

button {
  display: inline-block;
  border: none;
  border-radius: 12px;
  padding: 12px 20px;
  margin: 5px 4px 5px 0;
  background: var(--primary);
  color: #ffffff;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.2s, transform 0.2s;
}

button:hover {
  background: var(--primary-hover);
  transform: translateY(-1px);
}

button:focus-visible,
a:focus-visible {
  outline: 3px solid #aaaaff;
  outline-offset: 3px;
}

.card,
.word-card,
.result,
.dictionary-item,
article {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px;
  margin: 15px 0;
  box-shadow: var(--shadow);
  overflow-wrap: anywhere;
}

.card h3,
.word-card h3,
.result h3,
.dictionary-item h3,
article h3 {
  margin-top: 0;
  color: var(--primary);
}

a {
  color: var(--primary);
}

img {
  max-width: 100%;
  height: auto;
  border-radius: 12px;
}

footer {
  padding: 25px 16px;
  text-align: center;
  color: var(--muted);
  border-top: 1px solid var(--border);
  margin-top: 45px;
}

::selection {
  background: var(--primary);
  color: white;
}

/* ===== DARK MODE ===== */

body.dark {
  --bg: #101522;
  --surface: #1a2233;
  --text: #edf1fa;
  --muted: #a5b0c5;
  --primary: #9995ff;
  --primary-hover: #817cf0;
  --border: #303b50;
  --shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
}

body.dark nav a:hover {
  background: #29304a;
}

body.dark header {
  background: linear-gradient(135deg, #25265e, #45246f);
}

/* ===== MOBILE ===== */

@media (max-width: 600px) {
  header {
    padding: 28px 16px;
  }

  main {
    width: 94%;
    margin: 22px auto;
  }

  h2 {
    font-size: 22px;
  }

  .card,
  .word-card,
  .result,
  .dictionary-item,
  article {
    padding: 17px;
    border-radius: 14px;
  }

  button {
    max-width: 100%;
  }
}


    </style>
</head>
